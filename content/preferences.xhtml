<vbox class="zotero-siyuan-prefs">
	<groupbox>
		<label><html:h2 data-l10n-id="zotero-siyuan-prefs-connection"></html:h2></label>

		<html:div class="zotero-siyuan-row">
			<html:label for="cliPath" data-l10n-id="zotero-siyuan-prefs-cli"></html:label>
			<html:input id="cliPath" type="text" preference="extensions.zotero-siyuan.cliPath"/>
		</html:div>

		<html:div class="zotero-siyuan-row">
			<html:label for="workspace" data-l10n-id="zotero-siyuan-prefs-workspace"></html:label>
			<html:input id="workspace" type="text" preference="extensions.zotero-siyuan.workspace"/>
		</html:div>

		<html:div class="zotero-siyuan-row">
			<html:label for="notebook" data-l10n-id="zotero-siyuan-prefs-notebook"></html:label>
			<html:input id="notebook" type="text" preference="extensions.zotero-siyuan.notebook"/>
		</html:div>

		<html:div class="zotero-siyuan-row">
			<html:button id="zotero-siyuan-test-button" data-l10n-id="zotero-siyuan-prefs-test"></html:button>
			<html:span id="zotero-siyuan-test-result" class="zotero-siyuan-result"></html:span>
		</html:div>
	</groupbox>
</vbox>
