<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox class="main-section">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-cliPath"
        data-l10n-id="pref-cliPath"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-cliPath"
        preference="cliPath"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-workspace"
        data-l10n-id="pref-workspace"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-workspace"
        preference="workspace"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-notebook"
        data-l10n-id="pref-notebook"
      ></html:label>
      <!--
        A dropdown instead of a text box: the notebook that is picked has
        to exist, and "test the connection" already knows how to list them.
        The empty value means "the first usable one", which is what an
        untouched install wants.
      -->
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-notebook"
      >
        <html:option value="" data-l10n-id="pref-notebook-auto"></html:option>
      </html:select>
    </html:div>

    <html:div class="zsi-actions">
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-test"
        data-l10n-id="pref-test"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-selftest"
        data-l10n-id="pref-selftest"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-rescan"
        data-l10n-id="pref-rescan"
      ></html:button>
    </html:div>

    <html:p
      class="zsi-result"
      id="zotero-prefpane-zoteroSiYuan-result"
      role="status"
      aria-live="polite"
    ></html:p>

    <html:p class="zsi-hint" data-l10n-id="pref-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-destination-title"></html:h2></label>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-destination"
        data-l10n-id="pref-destination"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-destination"
      >
        <html:option
          value="daily"
          data-l10n-id="pref-destination-daily"
        ></html:option>
        <html:option
          value="document"
          data-l10n-id="pref-destination-document"
        ></html:option>
        <html:option
          value="item"
          data-l10n-id="pref-destination-item"
        ></html:option>
      </html:select>
    </html:div>

    <html:div
      class="zsi-field"
      id="zotero-prefpane-zoteroSiYuan-target-document-row"
    >
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-target-document"
        data-l10n-id="pref-target-document"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-target-document"
        preference="targetDocument"
      ></html:input>
    </html:div>

    <html:div
      class="zsi-field"
      id="zotero-prefpane-zoteroSiYuan-item-doc-row"
    >
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-item-doc-name"
        data-l10n-id="pref-item-doc-name"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-item-doc-name"
        preference="itemDocName"
      ></html:input>
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-item-doc-path"
        data-l10n-id="pref-item-doc-path"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-item-doc-path"
        preference="itemDocPath"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-sent-action"
        data-l10n-id="pref-sent-action"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-sent-action"
      >
        <html:option value="ask" data-l10n-id="pref-sent-action-ask"></html:option>
        <html:option
          value="skip"
          data-l10n-id="pref-sent-action-skip"
        ></html:option>
        <html:option
          value="send"
          data-l10n-id="pref-sent-action-send"
        ></html:option>
        <html:option
          value="replace"
          data-l10n-id="pref-sent-action-replace"
        ></html:option>
      </html:select>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-destination-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-auto-title"></html:h2></label>

    <html:div class="zsi-field zsi-field-check">
      <html:input
        class="zsi-checkbox"
        id="zotero-prefpane-zoteroSiYuan-auto-send"
        type="checkbox"
      ></html:input>
      <html:label
        for="zotero-prefpane-zoteroSiYuan-auto-send"
        data-l10n-id="pref-auto-send"
      ></html:label>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-auto-hint"></html:p>

    <html:div class="zsi-field">
      <html:label class="zsi-label" data-l10n-id="pref-auto-colors"></html:label>
      <!--
        The colours are written out instead of being built by the pane
        script: `data-l10n-id` on static markup is translated by Zotero
        itself, while an element made later would keep whatever text it was
        born with. The `data-auto-color` value is the Zotero colour.
      -->
      <html:div
        class="zsi-checks"
        id="zotero-prefpane-zoteroSiYuan-auto-colors"
      >
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#ffd400"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-yellow"></html:span>
          <html:span data-l10n-id="pref-auto-color-yellow"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#ff6666"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-red"></html:span>
          <html:span data-l10n-id="pref-auto-color-red"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#5fb236"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-green"></html:span>
          <html:span data-l10n-id="pref-auto-color-green"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#2ea8e5"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-blue"></html:span>
          <html:span data-l10n-id="pref-auto-color-blue"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#a28ae5"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-purple"></html:span>
          <html:span data-l10n-id="pref-auto-color-purple"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#e56eee"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-magenta"></html:span>
          <html:span data-l10n-id="pref-auto-color-magenta"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#f19837"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-orange"></html:span>
          <html:span data-l10n-id="pref-auto-color-orange"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-color="#aaaaaa"
          ></html:input>
          <html:span class="zsi-swatch zsi-swatch-gray"></html:span>
          <html:span data-l10n-id="pref-auto-color-gray"></html:span>
        </html:label>
      </html:div>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-auto-tags"
        data-l10n-id="pref-auto-tags"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-auto-tags"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label class="zsi-label" data-l10n-id="pref-auto-types"></html:label>
      <html:div
        class="zsi-checks"
        id="zotero-prefpane-zoteroSiYuan-auto-types"
      >
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-type="highlight"
          ></html:input>
          <html:span data-l10n-id="pref-auto-type-highlight"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-type="underline"
          ></html:input>
          <html:span data-l10n-id="pref-auto-type-underline"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-type="note"
          ></html:input>
          <html:span data-l10n-id="pref-auto-type-note"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-type="text"
          ></html:input>
          <html:span data-l10n-id="pref-auto-type-text"></html:span>
        </html:label>
        <html:label class="zsi-inline-check zsi-auto-choice">
          <html:input
            class="zsi-checkbox"
            type="checkbox"
            data-auto-type="image"
          ></html:input>
          <html:span data-l10n-id="pref-auto-type-image"></html:span>
        </html:label>
      </html:div>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-auto-item-types"
        data-l10n-id="pref-auto-item-types"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-auto-item-types"
      ></html:input>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-auto-filter-hint"></html:p>

    <html:div class="zsi-actions">
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-auto-queue-retry"
        data-l10n-id="pref-auto-queue-retry"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-auto-queue-clear"
        data-l10n-id="pref-auto-queue-clear"
      ></html:button>
    </html:div>

    <html:p
      class="zsi-result"
      id="zotero-prefpane-zoteroSiYuan-auto-queue-status"
      role="status"
      aria-live="polite"
    ></html:p>

    <html:p class="zsi-hint" data-l10n-id="pref-auto-queue-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-picture-title"></html:h2></label>

    <html:div class="zsi-field zsi-field-check">
      <html:input
        class="zsi-checkbox"
        id="zotero-prefpane-zoteroSiYuan-image-compress"
        type="checkbox"
      ></html:input>
      <html:label
        for="zotero-prefpane-zoteroSiYuan-image-compress"
        data-l10n-id="pref-image-compress"
      ></html:label>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-image-quality"
        data-l10n-id="pref-image-quality"
      ></html:label>
      <!--
        An HTML range input, not the XUL <slider> an earlier version used:
        the XUL slider no longer exists in the Firefox Zotero is built on,
        so that control simply did not appear.
      -->
      <html:input
        class="zsi-range"
        id="zotero-prefpane-zoteroSiYuan-image-quality-range"
        type="range"
        min="10"
        max="100"
        step="1"
      ></html:input>
      <html:input
        class="zsi-number"
        id="zotero-prefpane-zoteroSiYuan-image-quality"
        type="number"
        min="10"
        max="100"
        step="1"
      ></html:input>
    </html:div>

    <html:div class="zsi-actions">
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-checkpictures"
        data-l10n-id="pref-checkpictures"
      ></html:button>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-picture-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-template-title"></html:h2></label>

    <!--
      Two templates live behind this one editor: the common one, and the
      one for "one document per item" — a reading note is often a different
      shape from a note appended to the daily log.
    -->
    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-template-scope"
        data-l10n-id="pref-template-scope"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-template-scope"
      >
        <html:option
          value="note"
          data-l10n-id="pref-template-scope-note"
        ></html:option>
        <html:option
          value="item"
          data-l10n-id="pref-template-scope-item"
        ></html:option>
        <html:option
          value="info"
          data-l10n-id="pref-template-scope-info"
        ></html:option>
        <html:option
          value="abstract"
          data-l10n-id="pref-template-scope-abstract"
        ></html:option>
        <html:option
          value="notes"
          data-l10n-id="pref-template-scope-notes"
        ></html:option>
      </html:select>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-template-scope-hint"></html:p>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-template-preset"
        data-l10n-id="pref-template-preset"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-template-preset"
      ></html:select>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-template-preset-apply"
        data-l10n-id="pref-template-preset-apply"
      ></html:button>
    </html:div>

    <!--
      The shelf: the templates the user worked out and wants to keep. The
      dropdown lists them, the box next to it names the one being saved,
      and the three buttons are all the shelf needs.
    -->
    <html:div class="zsi-field zsi-field-templates">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-template-saved"
        data-l10n-id="pref-templates"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-template-saved"
      ></html:select>
      <html:input
        class="zsi-input"
        id="zotero-prefpane-zoteroSiYuan-template-save-name"
        type="text"
      ></html:input>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-template-save"
        data-l10n-id="pref-templates-save"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-template-load"
        data-l10n-id="pref-templates-load"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-template-delete"
        data-l10n-id="pref-templates-delete"
      ></html:button>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-templates-hint"></html:p>

    <html:div class="zsi-field">
      <html:label class="zsi-label" data-l10n-id="pref-template"></html:label>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-reset-template"
        data-l10n-id="pref-template-reset"
      ></html:button>
      <html:span
        class="zsi-status"
        id="zotero-prefpane-zoteroSiYuan-template-status"
        role="status"
        aria-live="polite"
      ></html:span>
    </html:div>

    <html:div
      class="zsi-problems"
      id="zotero-prefpane-zoteroSiYuan-template-problems"
    ></html:div>

    <html:textarea
      class="zsi-textarea"
      id="zotero-prefpane-zoteroSiYuan-template"
      rows="16"
      spellcheck="false"
    ></html:textarea>

    <html:label class="zsi-subhead" data-l10n-id="pref-preview"></html:label>
    <html:pre
      class="zsi-preview"
      id="zotero-prefpane-zoteroSiYuan-preview"
    ></html:pre>

    <html:div class="zsi-field zsi-field-filter">
      <html:label class="zsi-label" data-l10n-id="pref-variables"></html:label>
      <html:input
        class="zsi-input"
        id="zotero-prefpane-zoteroSiYuan-variable-filter"
        type="search"
      ></html:input>
      <html:label class="zsi-inline-check">
        <html:input
          class="zsi-checkbox"
          id="zotero-prefpane-zoteroSiYuan-variable-only-used"
          type="checkbox"
        ></html:input>
        <html:span data-l10n-id="pref-variables-only-used"></html:span>
      </html:label>
    </html:div>

    <html:div
      class="zsi-variables"
      id="zotero-prefpane-zoteroSiYuan-variables"
    ></html:div>

    <html:div class="zsi-field zsi-field-conditional">
      <html:label class="zsi-label" data-l10n-id="pref-conditionals"></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-conditional-variable"
      ></html:select>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-if"
        data-l10n-id="pref-conditionals-if"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-else"
        data-l10n-id="pref-conditionals-else"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-end"
        data-l10n-id="pref-conditionals-end"
      ></html:button>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-conditionals-hint"></html:p>
    <html:p class="zsi-hint" data-l10n-id="pref-variables-hint"></html:p>
    <html:p class="zsi-hint" data-l10n-id="pref-template-hint"></html:p>
  </groupbox>
</vbox>
