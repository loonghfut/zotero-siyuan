<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox class="main-section">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-cliPath"
        data-l10n-id="pref-cliPath"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-cliPath"
        preference="cliPath"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-workspace"
        data-l10n-id="pref-workspace"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-workspace"
        preference="workspace"
      ></html:input>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-notebook"
        data-l10n-id="pref-notebook"
      ></html:label>
      <html:input
        class="zsi-input"
        type="text"
        id="zotero-prefpane-zoteroSiYuan-notebook"
        preference="notebook"
      ></html:input>
    </html:div>

    <html:div class="zsi-actions">
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-test"
        data-l10n-id="pref-test"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-selftest"
        data-l10n-id="pref-selftest"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-rescan"
        data-l10n-id="pref-rescan"
      ></html:button>
    </html:div>

    <html:p
      class="zsi-result"
      id="zotero-prefpane-zoteroSiYuan-result"
      role="status"
      aria-live="polite"
    ></html:p>

    <html:p class="zsi-hint" data-l10n-id="pref-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-picture-title"></html:h2></label>

    <html:div class="zsi-field zsi-field-check">
      <html:input
        class="zsi-checkbox"
        id="zotero-prefpane-zoteroSiYuan-image-compress"
        type="checkbox"
      ></html:input>
      <html:label
        for="zotero-prefpane-zoteroSiYuan-image-compress"
        data-l10n-id="pref-image-compress"
      ></html:label>
    </html:div>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-image-quality"
        data-l10n-id="pref-image-quality"
      ></html:label>
      <!--
        An HTML range input, not the XUL <slider> an earlier version used:
        the XUL slider no longer exists in the Firefox Zotero is built on,
        so that control simply did not appear.
      -->
      <html:input
        class="zsi-range"
        id="zotero-prefpane-zoteroSiYuan-image-quality-range"
        type="range"
        min="10"
        max="100"
        step="1"
      ></html:input>
      <html:input
        class="zsi-number"
        id="zotero-prefpane-zoteroSiYuan-image-quality"
        type="number"
        min="10"
        max="100"
        step="1"
      ></html:input>
    </html:div>

    <html:div class="zsi-actions">
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-checkpictures"
        data-l10n-id="pref-checkpictures"
      ></html:button>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-picture-hint"></html:p>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-template-title"></html:h2></label>

    <html:div class="zsi-field">
      <html:label
        class="zsi-label"
        for="zotero-prefpane-zoteroSiYuan-template-preset"
        data-l10n-id="pref-template-preset"
      ></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-template-preset"
      ></html:select>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-template-preset-apply"
        data-l10n-id="pref-template-preset-apply"
      ></html:button>
    </html:div>

    <html:div class="zsi-field">
      <html:label class="zsi-label" data-l10n-id="pref-template"></html:label>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-reset-template"
        data-l10n-id="pref-template-reset"
      ></html:button>
      <html:span
        class="zsi-status"
        id="zotero-prefpane-zoteroSiYuan-template-status"
        role="status"
        aria-live="polite"
      ></html:span>
    </html:div>

    <html:div
      class="zsi-problems"
      id="zotero-prefpane-zoteroSiYuan-template-problems"
    ></html:div>

    <html:textarea
      class="zsi-textarea"
      id="zotero-prefpane-zoteroSiYuan-template"
      rows="16"
      spellcheck="false"
    ></html:textarea>

    <html:label class="zsi-subhead" data-l10n-id="pref-preview"></html:label>
    <html:pre
      class="zsi-preview"
      id="zotero-prefpane-zoteroSiYuan-preview"
    ></html:pre>

    <html:div class="zsi-field zsi-field-filter">
      <html:label class="zsi-label" data-l10n-id="pref-variables"></html:label>
      <html:input
        class="zsi-input"
        id="zotero-prefpane-zoteroSiYuan-variable-filter"
        type="search"
      ></html:input>
      <html:label class="zsi-inline-check">
        <html:input
          class="zsi-checkbox"
          id="zotero-prefpane-zoteroSiYuan-variable-only-used"
          type="checkbox"
        ></html:input>
        <html:span data-l10n-id="pref-variables-only-used"></html:span>
      </html:label>
    </html:div>

    <html:div
      class="zsi-variables"
      id="zotero-prefpane-zoteroSiYuan-variables"
    ></html:div>

    <html:div class="zsi-field zsi-field-conditional">
      <html:label class="zsi-label" data-l10n-id="pref-conditionals"></html:label>
      <html:select
        class="zsi-select"
        id="zotero-prefpane-zoteroSiYuan-conditional-variable"
      ></html:select>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-if"
        data-l10n-id="pref-conditionals-if"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-else"
        data-l10n-id="pref-conditionals-else"
      ></html:button>
      <html:button
        class="zsi-button"
        id="zotero-prefpane-zoteroSiYuan-conditional-end"
        data-l10n-id="pref-conditionals-end"
      ></html:button>
    </html:div>

    <html:p class="zsi-hint" data-l10n-id="pref-conditionals-hint"></html:p>
    <html:p class="zsi-hint" data-l10n-id="pref-variables-hint"></html:p>
    <html:p class="zsi-hint" data-l10n-id="pref-template-hint"></html:p>
  </groupbox>
</vbox>
