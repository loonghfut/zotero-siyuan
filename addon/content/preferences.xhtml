<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-cliPath"
      data-l10n-id="pref-cliPath"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-cliPath"
      preference="cliPath"
    ></html:input>
  </hbox>

  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-workspace"
      data-l10n-id="pref-workspace"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-workspace"
      preference="workspace"
    ></html:input>
  </hbox>

  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-notebook"
      data-l10n-id="pref-notebook"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-notebook"
      preference="notebook"
    ></html:input>
  </hbox>

  <hbox>
    <html:button
      id="zotero-prefpane-__addonRef__-test"
      data-l10n-id="pref-test"
    ></html:button>
    <html:span
      id="zotero-prefpane-__addonRef__-result"
      class="zotero-siyuan-result"
    ></html:span>
  </hbox>

  <hbox>
    <html:button
      id="zotero-prefpane-__addonRef__-selftest"
      data-l10n-id="pref-selftest"
    ></html:button>
    <html:button
      id="zotero-prefpane-__addonRef__-rescan"
      data-l10n-id="pref-rescan"
    ></html:button>
  </hbox>

  <html:p class="zotero-siyuan-hint" data-l10n-id="pref-hint"></html:p>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-template-title"></html:h2></label>

  <hbox class="zotero-siyuan-template-head">
    <html:label data-l10n-id="pref-template"></html:label>
    <html:button
      id="zotero-prefpane-__addonRef__-reset-template"
      data-l10n-id="pref-template-reset"
    ></html:button>
    <html:span
      id="zotero-prefpane-__addonRef__-template-status"
      class="zotero-siyuan-status"
    ></html:span>
  </hbox>

  <html:textarea
    id="zotero-prefpane-__addonRef__-template"
    rows="12"
    spellcheck="false"
  ></html:textarea>

  <html:label data-l10n-id="pref-preview"></html:label>
  <html:pre
    id="zotero-prefpane-__addonRef__-preview"
    class="zotero-siyuan-preview"
  ></html:pre>

  <html:label data-l10n-id="pref-variables"></html:label>
  <html:div
    id="zotero-prefpane-__addonRef__-variables"
    class="zotero-siyuan-variables"
  ></html:div>
  <html:p
    class="zotero-siyuan-hint"
    data-l10n-id="pref-variables-hint"
  ></html:p>

  <html:p class="zotero-siyuan-hint" data-l10n-id="pref-template-hint"></html:p>
</groupbox>
